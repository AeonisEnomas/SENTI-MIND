name: Keep alive

# Render's free tier spins the backend down after ~15 minutes idle, and Supabase pauses
# free projects after a period without database activity. Pinging /keepalive wakes the
# backend and makes it run a tiny Supabase query.
#
# GitHub may start scheduled runs late under load and disables schedules after 60 days
# without repository activity. Use an external pinger (cron-job.org, UptimeRobot) on
# /keepalive as a backup if you need guaranteed uptime.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set the repository variable BACKEND_URL to override the default service URL.
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://senti-mind-majc.onrender.com' }}
    steps:
      - name: Ping /keepalive
        run: |
          # A cold start can take close to a minute; retry through it.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            "${BACKEND_URL%/}/keepalive"
          echo
